{% extends "admin/index.html" %}

{% block content %}
<div style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #ffffff; padding: 22px 28px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
    <div>
        <h2 style="margin: 0; color: #ffffff; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
            <span>🚀</span> Mama Jaben Administration & Analytics
        </h2>
        <p style="margin: 6px 0 0 0; color: #94a3b8; font-size: 13px;">Monitor real-time revenue, ride activity, driver approvals, and passenger metrics.</p>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <a href="{% url 'admin_todays_update' %}" style="background: #10b981; color: #ffffff; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
            📅 Today's Live Update &rarr;
        </a>
        <a href="{% url 'admin_statistics' %}" style="background: #3b82f6; color: #ffffff; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
            📊 All-Time Statistics &rarr;
        </a>
    </div>
</div>

{{ block.super }}
{% endblock %}
